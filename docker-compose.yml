version: '3'
services:
  db:
    restart: unless-stopped
    image: postgres:12.7-alpine
    ports:
      - "${PGPORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${PGDATABASE:-blueraven}"
      POSTGRES_USER: "${PGUSER:-dbadmin}"
      POSTGRES_PASSWORD: "${PGPASSWORD:-password}"

