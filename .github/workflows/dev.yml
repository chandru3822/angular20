# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Albatross Build [Dev]

on:
  push:
    branches:
      - "dev"

jobs:
  build:
    name: Package API and Deploy to ECS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dev_env
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 16
        uses: actions/setup-java@v2
        with:
          java-version: 16
          distribution: 'zulu'
          cache: 'maven'

      - name: Maven Package
        run: mvn -B package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: set env
        id: vars
        run: |
          echo ::set-output name=github_short_sha::$(echo ${GITHUB_SHA:0:7})

      - name: Build & Push Image
        id: build-image
        env:
          DOCKER_BUILDKIT: 1
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: albatross-repo
          IMAGE_TAG: ${{ steps.vars.outputs.github_short_sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Fill in the new image ID for App Fargate task definition
        id: app-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/dev-definition.json
          container-name: albatross-dev-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Fill in the new image ID for Cron Fargate task definition
        id: cron-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/cron-dev-definition.json
          container-name: albatross-cron-dev-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy App Fargate Task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.app-task-def.outputs.task-definition }}
          service: albatross-dev-service
          cluster: albatross-dev-cluster

      - name: Deploy Cron Fargate Task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.cron-task-def.outputs.task-definition }}
          service: albatross-dev-cron-service
          cluster: albatross-dev-cluster

  html2pdf-build:
    name: Package Html2Pdf API and Deploy to ECS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Image
        id: build-image
        env:
          DOCKER_BUILDKIT: 1
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: albatross-html2pdf-repo
          IMAGE_TAG: ${{ steps.vars.outputs.github_short_sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_REF##*/} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_REF##*/}
          echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  frontend-build:
    name: Build Front End
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        name: Setup Node
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Build Site
        env:
          NETLIFY_SITE_ID: ${{ secrets.DEV_NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify build

      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: dist
          path: client/dist
          retention-days: 1

  netlify-deploy:
    name: Deploy UI to Netlify
    needs: [ build, frontend-build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v2
        with:
          name: dist
          path: client/dist

      - name: set env
        id: vars
        run: |
          echo ::set-output name=github_short_sha::$(echo ${GITHUB_SHA:0:7})

      - run: netlify deploy --dir=client/dist --prod --message "Deployed from GitHub Action sha $GITHUB_SHA"
        name: Deploy Site
        env:
          GITHUB_SHA: ${{ steps.vars.outputs.github_short_sha }}
          NETLIFY_SITE_ID: ${{ secrets.DEV_NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
