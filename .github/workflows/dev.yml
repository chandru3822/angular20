# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Albatross Build [Dev]

on:
  push:
    branches:
      - "dev"

jobs:
  build:
    name: Package API and Deploy to ECS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dev_env
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'maven'

      - name: Maven Package
        run: mvn -B package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: set env
        id: vars
        run: |
          echo github_short_sha=$(echo ${GITHUB_SHA:0:7}) >> $GITHUB_OUTPUT

      - name: Build & Push Image
        id: build-image
        env:
          DOCKER_BUILDKIT: 1
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: albatross-repo
          IMAGE_TAG: ${{ steps.vars.outputs.github_short_sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID for App Fargate task definition
        id: app-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/dev-definition.json
          container-name: albatross-dev-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Fill in the new image ID for Cron Fargate task definition
        id: cron-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/cron-dev-definition.json
          container-name: albatross-cron-dev-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy App Fargate Task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.app-task-def.outputs.task-definition }}
          service: albatross-dev-service
          cluster: albatross-dev-cluster

      - name: Deploy Cron Fargate Task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.cron-task-def.outputs.task-definition }}
          service: albatross-dev-cron-service
          cluster: albatross-dev-cluster

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: 7oaksgroup/ops-blueraven-albatross
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Update Image Tag
        env:
          TARGET_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          cd gitops/deploy/uat/api
          kustomize edit set image api=${TARGET_IMAGE}
          git config --global user.name "7 Oaks Group CI"
          git config --global user.email "dev+ci@7oaksgroup.com"
          git commit -am "${GITHUB_ACTOR}: set api image to ${TARGET_IMAGE}"
          git push

  frontend-build:
    name: Build Front End
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        name: Setup Node
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
          always-auth: true
          registry-url: https://npm.pkg.github.com
          scope: '@7oaksgroup'

      - name: set env
        id: vars
        run: |
          echo github_short_sha=$(echo ${GITHUB_SHA:0:7}) >> $GITHUB_OUTPUT

      - run: netlify deploy --build --prod --message "Deployed from GitHub Action sha $GITHUB_SHA"
        name: Deploy Site
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_SHA: ${{ steps.vars.outputs.github_short_sha }}
          NETLIFY_SITE_ID: ${{ secrets.DEV_NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

