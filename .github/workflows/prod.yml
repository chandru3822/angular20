name: Albatross Build [Prod]

on:
  push:
    branches:
      - "master"

jobs:
  build:
    name: Package & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: prod_env
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'maven'

      - name: Maven Package
        run: mvn -B package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: set env
        id: vars
        run: |
          echo github_short_sha=$(echo ${GITHUB_SHA:0:7}) >> $GITHUB_OUTPUT

      - name: Build & Push Image
        id: build-image
        env:
          DOCKER_BUILDKIT: 1
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: albatross-prod-repo
          IMAGE_TAG: ${{ steps.vars.outputs.github_short_sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG >> $GITHUB_OUTPUT

      - name: Fill in the new image ID for App Fargate task definition
        id: app-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/prod-definition.json
          container-name: albatross-prod-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Fill in the new image ID for Cron Fargate task definition
        id: cron-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/cron-prod-definition.json
          container-name: albatross-cron-prod-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy App Fargate Task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.app-task-def.outputs.task-definition }}
          service: albatross-prod-service
          cluster: albatross-prod-cluster

      - name: Deploy Cron Fargate Task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.cron-task-def.outputs.task-definition }}
          service: albatross-prod-cron-service
          cluster: albatross-prod-cluster
