# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
#

name: Albatross Build [Stage]

on: workflow_dispatch
#    push:
#        branches:
#            - "stage"

jobs:
    build:
        name: Package & Deploy
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
          group: stage_env
          cancel-in-progress: true
        steps:
            -   uses: actions/checkout@v3

            -   name: Configure AWS credentials
                uses: aws-actions/configure-aws-credentials@v2
                with:
                    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                    aws-region: us-east-1

            -   name: Login to Amazon ECR
                id: login-ecr
                uses: aws-actions/amazon-ecr-login@v1

            -   name: set env
                id: vars
                run: |
                    echo github_short_sha=$(echo ${GITHUB_SHA:0:7}) >> $GITHUB_OUTPUT

            -   name: Fill in the new image ID for App Fargate task definition
                id: app-task-def
                uses: aws-actions/amazon-ecs-render-task-definition@v1
                with:
                    task-definition: .aws/stage-definition.json
                    container-name: albatross-stage-container
                    image: 480699501737.dkr.ecr.us-east-1.amazonaws.com/albatross-repo:latest

            -   name: Fill in the new image ID for Cron Fargate task definition
                id: cron-task-def
                uses: aws-actions/amazon-ecs-render-task-definition@v1
                with:
                    task-definition: .aws/cron-stage-definition.json
                    container-name: albatross-cron-stage-container
                    image: 480699501737.dkr.ecr.us-east-1.amazonaws.com/albatross-repo:latest

            -   name: Deploy App Fargate Task
                uses: aws-actions/amazon-ecs-deploy-task-definition@v1
                with:
                    task-definition: ${{ steps.app-task-def.outputs.task-definition }}
                    service: albatross-stage-service
                    cluster: albatross-stage-cluster

            -   name: Deploy Cron Fargate Task
                uses: aws-actions/amazon-ecs-deploy-task-definition@v1
                with:
                    task-definition: ${{ steps.cron-task-def.outputs.task-definition }}
                    service: albatross-stage-cron-service
                    cluster: albatross-stage-cluster

    frontend-build:
      needs: build
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        name: Setup Node
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
          always-auth: true
          registry-url: https://npm.pkg.github.com
          scope: '@7oaksgroup'

    # Deploy the site with netlify-cli
      - run: netlify deploy --dir=client/dist --build --prod --message "Deployed from GitHub Action sha $GITHUB_SHA ref ${{ steps.vars.outputs.short_ref }}"
        name: Deploy Site
        env:
          GITHUB_SHA: ${{ steps.vars.outputs.github_short_sha }}
          NETLIFY_SITE_ID: ${{ secrets.STAGE_NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
