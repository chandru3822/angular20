# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Albatross Build [Flux]
on: workflow_dispatch
#      push:
#          branches:
#              - "document-center-ux"

jobs:
    build:
        name: Package & Deploy
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
          group: flux_env
          cancel-in-progress: true

        steps:
            -   uses: actions/checkout@v3
            -   name: Set up JDK 16
                uses: actions/setup-java@v3
                with:
                  java-version: 16
                  distribution: 'zulu'
                  cache: 'maven'

            -   name: Maven Package
                run: mvn -B package -DskipTests

            -   name: Configure AWS credentials
                uses: aws-actions/configure-aws-credentials@v2
                with:
                    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                    aws-region: us-east-1

            -   name: Login to Amazon ECR
                id: login-ecr
                uses: aws-actions/amazon-ecr-login@v1

            -   name: set env
                id: vars
                run: |
                    echo github_short_sha=$(echo ${GITHUB_SHA:0:7}) >> $GITHUB_OUTPUT

            -   name: Build & Push Image
                id: build-image
                env:
                    DOCKER_BUILDKIT: 1
                    ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                    ECR_REPOSITORY: albatross-flux-repo
                    IMAGE_TAG: ${{ steps.vars.outputs.github_short_sha }}
                run: |
                    docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                    docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                    docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
                    echo image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            -   name: Fill in the new image ID for App Fargate task definition
                id: app-task-def
                uses: aws-actions/amazon-ecs-render-task-definition@v1
                with:
                    task-definition: .aws/flux-definition.json
                    container-name: albatross-flux-container
                    image: ${{ steps.build-image.outputs.image }}

#            -   name: Fill in the new image ID for Cron Fargate task definition
#                id: cron-task-def
#                uses: aws-actions/amazon-ecs-render-task-definition@v1
#                with:
#                    task-definition: .aws/cron-dev-definition.json
#                    container-name: albatross-cron-dev-container
#                    image: ${{ steps.build-image.outputs.image }}

            -   name: Deploy App Fargate Task
                uses: aws-actions/amazon-ecs-deploy-task-definition@v1
                with:
                    task-definition: ${{ steps.app-task-def.outputs.task-definition }}
                    service: albatross-flux-service
                    cluster: albatross-flux-cluster

#            -   name: Deploy Cron Fargate Task
#                uses: aws-actions/amazon-ecs-deploy-task-definition@v1
#                with:
#                    task-definition: ${{ steps.cron-task-def.outputs.task-definition }}
#                    service: albatross-dev-cron-service
#                    cluster: albatross-dev-cluster

    frontend-build:
      needs: build
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        name: Setup Node
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
          always-auth: true
          registry-url: https://npm.pkg.github.com
          scope: '@7oaksgroup'

    # Deploy the site with netlify-cli
      - name: Deploy Site
        env:
          GITHUB_SHA: ${{ steps.vars.outputs.github_short_sha }}
          NETLIFY_SITE_ID: ${{ secrets.FLUX_NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: netlify deploy --dir=client/dist --build --prod --message "Deployed from GitHub Action sha $GITHUB_SHA ref ${{ steps.vars.outputs.short_ref }}"
